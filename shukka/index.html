<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出荷点検">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./shukka-icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<title>出荷点検チェック｜市岡工業</title>
<style>
/* 屋外の日光下で読むため、淡い色は使わない。ライト固定。 */
:root{
  --line:#101010; --ink:#101010; --sub:#4a4a4a; --bg:#ffffff; --band:#1a1a1a;
  --head:#e6e6e6; --stripe:#f2f2f2; --ok:#0b6b2f; --ng:#b3140c; --na:#5a5a5a;
  --ngbg:#ffe1de; --okbg:#dff3e4; --nabg:#eeeeee; --warn:#b3140c;
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;}
body{font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom);}
header{position:sticky;top:0;z-index:20;background:var(--band);color:#fff;}
header .hwrap{max-width:820px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;}
header .co{font-size:16px;font-weight:700;letter-spacing:.06em;line-height:1.25;}
header h1{margin:2px 0 0;font-size:19px;font-weight:700;letter-spacing:.14em;}
nav{display:flex;gap:0;margin-top:8px;}
nav button{flex:1;appearance:none;border:none;background:#3a3a3a;color:#ddd;
  font-size:15px;font-weight:700;padding:11px 0;cursor:pointer;border-bottom:3px solid transparent;}
nav button.on{background:#fff;color:#101010;border-bottom-color:#101010;}
main{padding:12px;max-width:820px;margin:0 auto;}
.card{border:1.5px solid var(--line);margin-bottom:12px;}
.card > h2{margin:0;background:var(--band);color:#fff;font-size:14px;font-weight:700;
  padding:7px 10px;letter-spacing:.06em;}
.card .body{padding:10px;}
label.f{display:block;margin-bottom:10px;}
label.f > span{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:3px;}
input,select,textarea{width:100%;font-size:16px;font-family:inherit;color:var(--ink);
  border:1.5px solid var(--line);background:#fff;padding:9px 8px;border-radius:0;}
textarea{min-height:70px;resize:vertical;}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#101010 50%),
  linear-gradient(135deg,#101010 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:34px;}
.row2{display:flex;gap:8px;} .row2 > *{flex:1;min-width:0;}
/* 点検の並びは、紙の点検表と同じく「罫線＋1行おきの網掛け」の表にする。
   行のズレ防止と、紙を見慣れた人がそのまま読めることが狙い。 */
.card.tbl > .body{padding:0;}
.thead{display:none;}
.item{border-top:1px solid #b5b5b5;padding:9px 10px;}
.item:first-child, .thead + .item{border-top:none;}
.item.alt{background:var(--stripe);}
.item.na{opacity:.6;}
.item .nm{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:baseline;}
.item .nm .no{font-size:11.5px;color:#fff;background:#5a5a5a;font-weight:700;
  min-width:1.8em;text-align:center;padding:1px 0;flex:0 0 auto;align-self:flex-start;margin-top:2px;}
.item.ngrow .nm .t{color:var(--ng);}
.item.na .nm .t{text-decoration:line-through;}
.item .cr{font-size:12.5px;color:var(--sub);margin:2px 0 7px 1.9em;}
.seg{display:flex;gap:6px;margin-left:1.9em;}
.seg button{flex:1;appearance:none;font-family:inherit;font-size:15px;font-weight:700;
  padding:9px 0;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
.seg button.on[data-v="ok"]{background:var(--ok);border-color:var(--ok);color:#fff;}
.seg button.on[data-v="ng"]{background:var(--ng);border-color:var(--ng);color:#fff;}
.seg button.on[data-v="na"]{background:var(--na);border-color:var(--na);color:#fff;}
.memo{margin:7px 0 0 1.9em;}
.memo input{border-color:var(--ng);}
table.meas{width:100%;border-collapse:collapse;}
table.meas th,table.meas td{border:1px solid var(--line);padding:6px 7px;font-size:13px;vertical-align:middle;}
table.meas th{background:var(--head);font-size:12.5px;}
table.meas td.std{font-size:12px;color:var(--sub);}
table.meas input{padding:7px 6px;font-size:15px;}
.sum{display:flex;gap:8px;margin-bottom:10px;}
.sum div{flex:1;border:1.5px solid var(--line);padding:7px 4px;text-align:center;}
.sum .n{font-size:22px;font-weight:700;line-height:1.1;}
.sum .l{font-size:11.5px;color:var(--sub);font-weight:700;}
.sum .ng .n{color:var(--ng);}
.alert{border:2px solid var(--warn);background:var(--ngbg);color:var(--warn);
  font-weight:700;padding:9px 10px;margin-bottom:10px;font-size:14px;}
.note{background:var(--stripe);border:1px solid #bdbdbd;padding:8px 10px;font-size:12.5px;color:var(--sub);}
button.big{display:block;width:100%;appearance:none;font-family:inherit;font-size:17px;font-weight:700;
  padding:15px 0;border:none;background:var(--band);color:#fff;cursor:pointer;margin-bottom:10px;}
button.big[disabled]{background:#9a9a9a;cursor:default;}
button.sub{appearance:none;font-family:inherit;font-size:14px;font-weight:700;padding:10px 12px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
.rec{border:1.5px solid var(--line);margin-bottom:10px;}
.rec .h{display:flex;justify-content:space-between;gap:8px;background:var(--head);padding:7px 9px;font-size:13px;font-weight:700;}
.rec .b{padding:8px 9px;font-size:13.5px;}
.rec .jd{font-weight:700;}
.rec .jd.ng{color:var(--ng);}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 6px;border:1px solid var(--line);}
.badge.wait{background:#ffe9b8;}
.badge.sent{background:var(--okbg);}
.muted{color:var(--sub);font-size:13px;}
/* 記録の一覧に出す小さいサイン。入っているか一目で分かるように */
.ssigns{display:flex;gap:8px;margin-top:6px;}
.ssign{flex:1;min-width:0;border:1px solid #b5b5b5;background:#fff;
  height:52px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.ssign img{max-height:44px;max-width:92%;}
.ssign .none{color:#9a9a9a;font-size:12.5px;font-weight:700;}
.ssign .lb{position:absolute;left:0;top:0;background:#e6e6e6;color:var(--sub);
  font-size:10.5px;font-weight:700;padding:1px 5px;}
hr.sep{border:none;border-top:1px solid #bdbdbd;margin:12px 0;}
.state{font-size:13px;font-weight:700;padding:6px 9px;border:1.5px solid var(--line);margin-bottom:10px;}
.state.on{background:var(--okbg);} .state.off{background:#ffe9b8;}

/* ── パソコンで開いたとき ──────────────────────────────
   スマホは画面いっぱいで良いが、広い画面だと横に間延びして読みにくい。
   紙の出荷点検票と同じ見え方（グレーの地に白い紙）に揃える。 */
@media screen and (min-width:820px){
  body{background:#5f5f5f;}
  header{box-shadow:0 2px 8px rgba(0,0,0,.35);}
  main{background:var(--bg);border:1px solid #3a3a3a;padding:18px 22px 24px;
       margin:14px auto 22px;box-shadow:0 3px 12px rgba(0,0,0,.4);}
}
/* 判定ボタンは項目の右にまとめる。全幅に伸ばすと押しにくく、間延びして見える。 */
@media screen and (min-width:720px){
  .thead{display:grid;grid-template-columns:1fr 288px;column-gap:16px;
        background:var(--head);border-bottom:1.5px solid var(--line);
        font-size:12px;font-weight:700;color:var(--sub);padding:5px 10px;letter-spacing:.08em;}
  .thead .r{text-align:center;}
  .item{display:grid;grid-template-columns:1fr 288px;column-gap:16px;align-items:center;
        padding:7px 10px;}
  .item .nm{grid-column:1;grid-row:1;}
  .item .cr{grid-column:1;grid-row:2;margin:1px 0 0 1.9em;}
  .item .seg{grid-column:2;grid-row:1 / span 2;margin-left:0;}
  .item .memo{grid-column:1 / -1;grid-row:3;margin:6px 0 0 1.9em;}
  .seg button{padding:7px 0;}
}
@media print{ nav,button,.state{display:none;} }

/* ── サイン欄 ──────────────────────────────────
   指かタッチペンで、その場で書いてもらう。前のサインは使い回さない。 */
.signrow{display:flex;gap:8px;align-items:stretch;margin-bottom:10px;}
.signbox{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;
  height:64px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.signbox img{max-height:58px;max-width:100%;}
.signbox .ph{color:#9a9a9a;font-size:13px;font-weight:700;}
.signrow button{flex:0 0 auto;}
#signOverlay{position:fixed;inset:0;z-index:60;background:#1a1a1a;
  display:flex;flex-direction:column;}
#signOverlay[hidden]{display:none;}
#signBar{padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;color:#fff;
  display:flex;gap:8px;align-items:center;}
#signBar .t{font-size:15px;font-weight:700;margin-right:auto;}
#signBar button{appearance:none;font-family:inherit;font-size:15px;font-weight:700;
  padding:9px 14px;border:1.5px solid #fff;background:transparent;color:#fff;cursor:pointer;}
#signBar button.go{background:#fff;color:#101010;}
#signWrap{flex:1;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;}
#signPad{flex:1;width:100%;background:#fff;border:2px solid #fff;touch-action:none;
  cursor:crosshair;min-height:180px;}
#signHint{color:#ddd;font-size:13px;text-align:center;padding-bottom:env(safe-area-inset-bottom);}

/* ── 紙の様式で出す画面 ────────────────────────────
   工場でスマホに入れた内容を、そのまま紙の出荷点検票に流し込んで印刷する。
   総務はこれを刷って提出する。様式の中身は sheet.mjs（白紙の様式と共通）。 */
#paperOverlay{position:fixed;inset:0;z-index:50;background:#5f5f5f;overflow:auto;}
#paperOverlay[hidden]{display:none;}
#paperBar{position:sticky;top:0;z-index:2;background:var(--band);color:#fff;
  padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
#paperBar .t{font-size:14px;font-weight:700;margin-right:auto;}
#paperBar button{appearance:none;font-family:inherit;font-size:15px;font-weight:700;
  padding:9px 16px;border:1.5px solid #fff;background:#fff;color:#101010;cursor:pointer;}
#paperBar button.ghost{background:transparent;color:#fff;}
#paperHint{color:#ddd;font-size:12.5px;flex:1 0 100%;text-align:center;}
@media screen and (min-width:720px){ #paperHint{flex:0 0 auto;text-align:right;} }
#paperWrap{padding:14px 0 40px;}
@media screen and (max-width:900px){ #paper .sheet{ zoom:.62; } }
@media screen and (max-width:560px){ #paper .sheet{ zoom:.44; } }
@media print{
  body.printing > header, body.printing > main, body.printing #paperBar{ display:none !important; }
  body.printing #paperOverlay{ position:static; background:#fff; overflow:visible; }
  body.printing #paperWrap{ padding:0; }
  /* 埋め込みCSS（#paper .sheet）より後に来るとは限らないので、指定を強くしておく */
  body.printing #paper .sheet{ zoom:1; width:auto; min-height:0; margin:0; padding:0; box-shadow:none; }
}
</style>
<style id="paperStyle">@page { size: A4 portrait; margin: 8mm 10mm 6mm 10mm; }
#paper { font-family:"Noto Sans CJK JP","IPAGothic",sans-serif; color:#000;
  line-height:normal; font-size:medium; font-weight:400; letter-spacing:normal; text-align:left; }

#paper * { box-sizing: border-box; }
#paper .sheet { page-break-after: always; }
#paper .sheet:last-child { page-break-after: auto; }
#paper .ttl { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:1.6mm; }
#paper .ttl h1 { font-size:16pt; letter-spacing:.36em; margin:0 0 0 6mm; font-weight:700; }
#paper .ttl .co { font-size:10.5pt; font-weight:700; }
#paper .ttl .sub { font-size:8pt; text-align:right; line-height:1.5; }
#paper table { border-collapse:collapse; width:100%; table-layout:fixed; }
#paper td,#paper th { border:0.35mm solid #000; padding:0.4mm 1.3mm; font-size:9pt; line-height:1.15; vertical-align:middle; }
#paper .thick { border:0.7mm solid #000; }
#paper .hd td { height:7.2mm; }
#paper .hd .lb { background:#ededed; text-align:center; font-size:8.5pt; font-weight:700; }
#paper .hd .dt { white-space:nowrap; font-size:9.5pt; }
#paper .hd .big { font-size:12pt; font-weight:700; }
#paper .sec { margin-top:1.8mm; margin-bottom:0; font-size:9.5pt; font-weight:700;
       background:#1a1a1a; color:#fff; padding:0.5mm 2mm; letter-spacing:.1em; }
#paper .chk td { height:5.0mm; }
#paper .chk .no { text-align:center; font-size:8.5pt; background:#fafafa; }
#paper .chk .it { font-size:9pt; }
#paper .chk .cr { font-size:8pt; }
#paper .chk .jd { text-align:center; font-size:9.5pt; letter-spacing:.08em; color:#333; }
#paper .chk .ac { font-size:7.4pt; line-height:1.1; }
#paper .chk tr, #paper .meas tr { page-break-inside:avoid; }
#paper .sig, #paper .note, #paper .rem { page-break-inside:avoid; }
#paper .chk thead th { height:5mm; background:#e6e6e6; font-size:8.5pt; font-weight:700; text-align:center; }
#paper .chk tbody tr:nth-child(even) td { background:#fafafa; }
#paper .chk tbody tr:nth-child(even) .no { background:#f2f2f2; }
#paper .meas thead th { height:5mm; background:#e6e6e6; font-size:8.5pt; font-weight:700; text-align:center; }
#paper .meas td { height:6.0mm; }
#paper .meas .mi { font-size:9pt; }
#paper .meas .mc { font-size:7.9pt; }
#paper .meas .mv { font-size:8.5pt; text-align:right; color:#333; }
#paper .meas .mv b { font-size:10pt; color:#000; }
#paper .meas tbody tr:nth-child(even) td { background:#fafafa; }
#paper .rem td { height:10mm; vertical-align:top; }
#paper .rem .lb { background:#ededed; text-align:center; font-weight:700; font-size:8.5pt; vertical-align:middle; }
#paper .rem .txt { font-size:9pt; line-height:1.3; white-space:pre-wrap; }
#paper .sig .lb { background:#ededed; text-align:center; font-weight:700; font-size:8.5pt; height:5.4mm; }
#paper .sig .box { height:9mm; text-align:center; font-size:10pt; vertical-align:middle; }
/* 手書きのサイン。押印欄の高さ（9mm）を超えないこと。超えると1枚に収まらなくなる */
#paper .sig .box img { display:block; margin:0 auto; max-height:8mm; max-width:100%; }
#paper .jdg { text-align:center; font-size:9.5pt; font-weight:700; letter-spacing:0; white-space:nowrap; }
#paper .note { margin-top:1.4mm; }
#paper .note table { table-layout:fixed; }
#paper .note td { border:none; padding:0 3mm 0 0; font-size:6.7pt; line-height:1.3; vertical-align:top; }
#paper .note div { margin-bottom:0.4mm; }
#paper .note b { font-size:7.8pt; }

/* 記入済みで刷るときの印。良／否のどちらかを丸で囲み、該当しない項目には横線を引く。
   紙に手で書くときと同じ見え方にしてある。 */
/* 丸は「重ねて描く」こと。inline-block で囲むと行の高さが 0.6mm 増え、
   25行ぶんで約15mm 伸びてA4に収まらなくなる（実際に8ページになった）。
   position:absolute にして場所を取らせないのが要点。触ったら必ずページ数を確認する。 */
#paper .cir, #paper .cirw { position:relative; font-weight:700; }
#paper .cir::before, #paper .cirw::before { content:""; position:absolute; border:0.35mm solid #000;
       left:-1.0mm; right:-1.0mm; top:50%; height:4.2mm; margin-top:-2.1mm; border-radius:50%; }
/* 「合格」「要整備」のように2文字以上を囲むとき。真円だと間延びするので角丸にする */
#paper .cirw::before { left:-1.4mm; right:-1.4mm; height:4.6mm; margin-top:-2.3mm; border-radius:2.3mm; }
#paper .na .it { text-decoration:line-through; }
#paper .na .cr, #paper .na .jd { color:#8a8a8a; }
#paper .ng .it { font-weight:700; }

@media screen {
  #paper .sheet { width:210mm; min-height:297mm; background:#fff; margin:0 auto 14px;
           padding:8mm 10mm 6mm; box-shadow:0 3px 12px rgba(0,0,0,.45); }
  #paper .sheet:last-child { margin-bottom:0; }
}</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="co" id="coName"></div>
    <h1>出 荷 点 検 チ ェ ッ ク 表</h1>
    <nav>
      <button id="tabCheck" class="on">点検する</button>
      <button id="tabList">記録</button>
      <button id="tabSet">設定</button>
    </nav>
  </div>
</header>
<main id="main"></main>

<div id="signOverlay" hidden>
  <div id="signBar">
    <span class="t" id="signTitle"></span>
    <button id="signClear">書き直す</button>
    <button id="signCancel">やめる</button>
    <button id="signOk" class="go">これでいい</button>
  </div>
  <div id="signWrap">
    <canvas id="signPad"></canvas>
    <div id="signHint">白いところに、指かタッチペンで名前を書いてください</div>
  </div>
</div>

<div id="paperOverlay" hidden>
  <div id="paperBar">
    <span class="t" id="paperTitle"></span>
    <button id="paperPrint">PDFで保存する</button>
    <button id="paperPaper" class="ghost">紙に印刷する</button>
    <button id="paperClose" class="ghost">閉じる</button>
    <span id="paperHint">どちらも同じ画面が出ます。<b>保存先</b>で「PDF」を選べばPDF、プリンターを選べば紙です。</span>
  </div>
  <div id="paperWrap"><div id="paper"></div></div>
</div>

/* 紙の様式を組み立てる部品。sheet.mjs の中身をそのまま埋め込んでいる（buildapp.mjs が行う）。
   白紙の様式（build.mjs）と同じものを使うので、紙とアプリで見た目がずれない。 */
const SHEET = (function(){
// 紙の出荷点検票（A4縦1枚）を組み立てるところ。
//
// ここを使うのは2つ。
//   build.mjs        … 白紙の様式6枚（印刷して手書きするぶん）
//   出荷点検チェック   … アプリで入力した内容を、この様式に流し込んで印刷するぶん
//
// 見た目を直すときは、この1か所だけ直せば両方に効く。
// buildapp.mjs は、このファイルの中身から export を外してアプリに埋め込んでいる。
// そのため **ここでは import を書かないこと**。書くとアプリ側で動かなくなる。

const PAGE_CSS = `@page { size: A4 portrait; margin: 8mm 10mm 6mm 10mm; }`;

// sel に body（単体の印刷用HTML）か #paper（アプリの印刷画面）が入る
function paperBase(sel) {
  // フォントを足さないこと。Yu Gothic を足しただけで字幅が変わり、
  // 着眼点が折り返して1様式がA4に収まらなくなった（8ページになった）。
  //
  // line-height などを既定値に戻しているのは、アプリに埋め込んだとき body の指定
  // （line-height:1.45）が紙の中まで効いてしまい、1様式が約6mm 伸びたため。
  return `${sel} { font-family:"Noto Sans CJK JP","IPAGothic",sans-serif; color:#000;
  line-height:normal; font-size:medium; font-weight:400; letter-spacing:normal; text-align:left; }`;
}

// P に "" （単体）か "#paper " （アプリ）が入る
function paperCss(P) {
  return `
${P}* { box-sizing: border-box; }
${P}.sheet { page-break-after: always; }
${P}.sheet:last-child { page-break-after: auto; }
${P}.ttl { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:1.6mm; }
${P}.ttl h1 { font-size:16pt; letter-spacing:.36em; margin:0 0 0 6mm; font-weight:700; }
${P}.ttl .co { font-size:10.5pt; font-weight:700; }
${P}.ttl .sub { font-size:8pt; text-align:right; line-height:1.5; }
${P}table { border-collapse:collapse; width:100%; table-layout:fixed; }
${P}td,${P}th { border:0.35mm solid #000; padding:0.4mm 1.3mm; font-size:9pt; line-height:1.15; vertical-align:middle; }
${P}.thick { border:0.7mm solid #000; }
${P}.hd td { height:7.2mm; }
${P}.hd .lb { background:#ededed; text-align:center; font-size:8.5pt; font-weight:700; }
${P}.hd .dt { white-space:nowrap; font-size:9.5pt; }
${P}.hd .big { font-size:12pt; font-weight:700; }
${P}.sec { margin-top:1.8mm; margin-bottom:0; font-size:9.5pt; font-weight:700;
       background:#1a1a1a; color:#fff; padding:0.5mm 2mm; letter-spacing:.1em; }
${P}.chk td { height:5.0mm; }
${P}.chk .no { text-align:center; font-size:8.5pt; background:#fafafa; }
${P}.chk .it { font-size:9pt; }
${P}.chk .cr { font-size:8pt; }
${P}.chk .jd { text-align:center; font-size:9.5pt; letter-spacing:.08em; color:#333; }
${P}.chk .ac { font-size:7.4pt; line-height:1.1; }
${P}.chk tr, ${P}.meas tr { page-break-inside:avoid; }
${P}.sig, ${P}.note, ${P}.rem { page-break-inside:avoid; }
${P}.chk thead th { height:5mm; background:#e6e6e6; font-size:8.5pt; font-weight:700; text-align:center; }
${P}.chk tbody tr:nth-child(even) td { background:#fafafa; }
${P}.chk tbody tr:nth-child(even) .no { background:#f2f2f2; }
${P}.meas thead th { height:5mm; background:#e6e6e6; font-size:8.5pt; font-weight:700; text-align:center; }
${P}.meas td { height:6.0mm; }
${P}.meas .mi { font-size:9pt; }
${P}.meas .mc { font-size:7.9pt; }
${P}.meas .mv { font-size:8.5pt; text-align:right; color:#333; }
${P}.meas .mv b { font-size:10pt; color:#000; }
${P}.meas tbody tr:nth-child(even) td { background:#fafafa; }
${P}.rem td { height:10mm; vertical-align:top; }
${P}.rem .lb { background:#ededed; text-align:center; font-weight:700; font-size:8.5pt; vertical-align:middle; }
${P}.rem .txt { font-size:9pt; line-height:1.3; white-space:pre-wrap; }
${P}.sig .lb { background:#ededed; text-align:center; font-weight:700; font-size:8.5pt; height:5.4mm; }
${P}.sig .box { height:9mm; text-align:center; font-size:10pt; vertical-align:middle; }
/* 手書きのサイン。押印欄の高さ（9mm）を超えないこと。超えると1枚に収まらなくなる */
${P}.sig .box img { display:block; margin:0 auto; max-height:8mm; max-width:100%; }
${P}.jdg { text-align:center; font-size:9.5pt; font-weight:700; letter-spacing:0; white-space:nowrap; }
${P}.note { margin-top:1.4mm; }
${P}.note table { table-layout:fixed; }
${P}.note td { border:none; padding:0 3mm 0 0; font-size:6.7pt; line-height:1.3; vertical-align:top; }
${P}.note div { margin-bottom:0.4mm; }
${P}.note b { font-size:7.8pt; }

/* 記入済みで刷るときの印。良／否のどちらかを丸で囲み、該当しない項目には横線を引く。
   紙に手で書くときと同じ見え方にしてある。 */
/* 丸は「重ねて描く」こと。inline-block で囲むと行の高さが 0.6mm 増え、
   25行ぶんで約15mm 伸びてA4に収まらなくなる（実際に8ページになった）。
   position:absolute にして場所を取らせないのが要点。触ったら必ずページ数を確認する。 */
${P}.cir, ${P}.cirw { position:relative; font-weight:700; }
${P}.cir::before, ${P}.cirw::before { content:""; position:absolute; border:0.35mm solid #000;
       left:-1.0mm; right:-1.0mm; top:50%; height:4.2mm; margin-top:-2.1mm; border-radius:50%; }
/* 「合格」「要整備」のように2文字以上を囲むとき。真円だと間延びするので角丸にする */
${P}.cirw::before { left:-1.4mm; right:-1.4mm; height:4.6mm; margin-top:-2.3mm; border-radius:2.3mm; }
${P}.na .it { text-decoration:line-through; }
${P}.na .cr, ${P}.na .jd { color:#8a8a8a; }
${P}.ng .it { font-weight:700; }
`;
}

// 画面で見るときだけ、1様式ずつ白い紙に見せる。印刷結果には影響しない。
// これが無いと6枚が続けて並び、ブラウザで開いたとき同じ書類がダブって出たように見える。
function paperScreenCss(P) {
  return `
@media screen {
  ${P}.sheet { width:210mm; min-height:297mm; background:#fff; margin:0 auto 14px;
           padding:8mm 10mm 6mm; box-shadow:0 3px 12px rgba(0,0,0,.45); }
  ${P}.sheet:last-child { margin-bottom:0; }
}`;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#x27;" }[c])
  );
}

// 判定欄。記入済みなら選んだ方を丸で囲む
function jdCell(status) {
  if (status === "ok") return '<span class="cir">良</span> ・ 否';
  if (status === "ng") return '良 ・ <span class="cir">否</span>';
  return "良 ・ 否";
}

// 押印欄。その場で書いた手書きサインがあればそれを出す。無ければ名前の文字。
// サインは毎回書き直す運用（使い回さない）。同じ判子が並ぶのを避けるため。
function signCell(rec, who, name) {
  const img = rec && rec.signs && rec.signs[who];
  if (img) return `<img src="${img}" alt="">`;
  return esc(name || "");
}

// 年月日。空なら手書き用の空欄のまま
function dateCell(v) {
  if (!v) return "　　年　　月　　日";
  const a = String(v).split("-");
  if (a.length !== 3) return esc(v);
  return `${Number(a[0])}年${Number(a[1])}月${Number(a[2])}日`;
}

function rows(items, start, answers) {
  const out = [];
  items.forEach(([it, cr], k) => {
    const no = start + k;
    const a = answers ? answers[no] : null;
    const cls = a && a.status ? ` class="${a.status === "na" ? "na" : a.status === "ng" ? "ng" : ""}"` : "";
    out.push(
      `<tr${cls}><td class="no">${no}</td><td class="it">${esc(it)}</td>` +
        `<td class="cr">${esc(cr)}</td><td class="jd">${jdCell(a && a.status)}</td>` +
        `<td class="ac">${esc((a && a.memo) || "")}</td></tr>`
    );
  });
  return [out.join(""), start + items.length];
}

/**
 * 1様式ぶんのHTMLを返す。

function buildSheet(opt) {
  const { company, machine, idx, total, common, attach, maxrows, rec } = opt;

  // 記録の中身を No で引けるようにしておく
  const answers = {};
  if (rec && rec.items) rec.items.forEach((i) => { answers[i.no] = i; });
  const measVal = {};
  if (rec && rec.meas) rec.meas.forEach((m) => { measVal[m.name] = m.value; });

  // 特記事項欄の高さ。白紙のときは項目数の少ない様式ほど大きくして、余白を埋める。
  // 記入済みのときは、処置欄に長い文が入ると行が伸びるので、その分だけこの欄を詰める。
  // A4に余裕がまったく無いので、これをやらないと1枚に収まらなくなる。
  const CH_PER_LINE = 15; // 処置欄（36mm・7.4pt）に入る全角のおよその数
  let extraMm = 0;
  Object.keys(answers).forEach((k) => {
    const t = (answers[k] && answers[k].memo) || "";
    if (!t) return;
    const lines = Math.ceil(Array.from(t).length / CH_PER_LINE);
    if (lines > 1) extraMm += (lines - 1) * 2.7;
  });
  const remh = Math.max(5, 8 + (maxrows - common.length - machine.items.length) * 5.2 - extraMm);
  let n = 1;
  let c, s, a;
  [c, n] = rows(common, n, rec ? answers : null);
  [s, n] = rows(machine.items, n, rec ? answers : null);
  [a, n] = rows(attach, n, rec ? answers : null);

  const mrows = machine.meas
    .map(([nm, std, unit]) => {
      const v = measVal[nm];
      // 単位欄は2種類ある。「MPa」のような単なる単位と、「素線切れ　本／径　mm」のような
      // 手書き用の型。前者は数値の後ろに残し、後者は書き込み済みなら消す（二重に出ると読みにくい）
      const isTemplate = /　/.test(unit);
      const cell = v ? (isTemplate ? `<b>${esc(v)}</b>` : `<b>${esc(v)}</b>　${esc(unit)}`) : esc(unit);
      return `<tr><td class="mi">${esc(nm)}</td><td class="mc">${esc(std)}</td><td class="mv">${cell}</td></tr>`;
    })
    .join("");

  const cirIf = (label, on) => (on ? `<span class="cirw">${label}</span>` : label);
  const judge = rec ? rec.judge : "";

  return `
<div class="sheet">

  <table class="hd thick">

      <col style="width:20mm"><col style="width:36mm"></colgroup>
    <tr><td class="lb">機　械　名</td><td class="big">${esc(machine.name)}</td>
        <td class="lb">型式・規格</td><td>${esc((rec && rec.model) || machine.model)}</td>
        <td class="lb">管理番号</td><td>${esc((rec && rec.mgmtNo) || "")}</td></tr>
    <tr><td class="lb">出荷先現場名</td><td colspan="3">${esc((rec && rec.site) || "")}</td>
        <td class="lb">出荷予定日</td><td class="dt">${dateCell(rec && rec.shipDate)}</td></tr>
    <tr><td class="lb">元請・一次会社</td><td colspan="3">${esc((rec && rec.client) || "")}</td>
        <td class="lb">返却予定日</td><td class="dt">${dateCell(rec && rec.returnDate)}</td></tr>
  </table>

  <div class="sec">Ⅰ．共通点検項目（全機種）</div>
  <table class="chk">${COLS}${HEAD}<tbody>${c}</tbody></table>

  <div class="sec">Ⅱ．機種別点検項目　―　${esc(machine.name)}</div>
  <table class="chk">${COLS}<tbody>${s}</tbody></table>

  <div class="sec">Ⅲ．付属品・書類</div>
  <table class="chk">${COLS}<tbody>${a}</tbody></table>

  <div class="sec">Ⅳ．測定値（数字で記入すること）</div>
  <table class="meas">
    <colgroup><col style="width:44mm"><col><col style="width:44mm"></colgroup>
    <thead><tr><th>測　定　項　目</th><th>基　準　値 ・ 判　定　基　準</th><th>実　測　値</th></tr></thead>
    <tbody>${mrows}</tbody>
  </table>

  <table class="rem" style="margin-top:1.6mm">
    <colgroup><col style="width:24mm"><col></colgroup>
    <tr><td class="lb">特記事項<br>不具合と処置</td>
        <td class="txt" style="height:${remh.toFixed(1)}mm">${esc((rec && rec.remark) || "")}</td></tr>
  </table>

  <table class="sig thick" style="margin-top:1.6mm">
    <colgroup><col style="width:48mm"><col style="width:34mm"><col><col><col></colgroup>
    <tr><td class="lb">総　合　判　定</td><td class="lb">判 定 年 月 日</td>
        <td class="lb">点　検　者</td><td class="lb">確認者（職長）</td><td class="lb">出荷責任者</td></tr>
    <tr><td class="jdg">${cirIf("合　格", judge === "合格")} ・ ${cirIf("要整備", judge === "要整備")} ・ ${cirIf("出荷不可", judge === "出荷不可")}</td>
        <td style="text-align:center;font-size:9.5pt;white-space:nowrap">${dateCell(rec && rec.judgeDate)}</td>
        <td class="box">${signCell(rec, "inspector", rec && rec.inspector)}</td>

        <td class="box">${signCell(rec, "shipper", rec && rec.shipper)}</td></tr>
  </table>

  <div class="note">
    <div style="font-size:7.6pt;font-weight:700;margin-bottom:0.6mm">【記入のしかた】</div>
    <table><colgroup><col style="width:50%"><col></colgroup><tr><td>
      <div>① 判定欄は、良ければ「良」、悪ければ「否」を <b>○で囲む</b>。その機械に無い項目は項目名に横線を引く。</div>
      <div>② 「否」があったら処置欄に <b>何がどう悪いか</b> と <b>どう直したか</b> を書く。直したら再点検して「良」に訂正する（二重線＋押印）。</div>
      <div>③ 絶縁抵抗・圧力などは <b>測った値を数字で書く</b>。絶縁抵抗は電源を切ってから測る。</div>
    </td><td>
      <div>④ <b>「否」が1つでも残る機械は出荷しない。</b>「要整備」で出す場合は出荷責任者の承認をもらう。</div>
      <div>⑤ 機械1台につき1枚書く。控を社内に保存し、原本は機械に付けて出荷する。現場搬入時は、この結果を「持込機械等使用届（安衛則第329条）」の点検表に転記する。</div>
      <div>⑥ 基準値欄の「参考」は一般的な目安。<b>取扱説明書・銘板の値を確認して書き換え、確定させること。</b></div>
    </td></tr></table>
  </div>
</div>`;
}

return { buildSheet: buildSheet };
})();

/* ---- 端末保存（ブラウザが拒む場合は画面を開いている間だけ覚える） ---- */
const P = 'shukka:';
const memStore = new Map();
const canStore = (()=>{ try{ localStorage.setItem(P+'__t','1'); localStorage.removeItem(P+'__t'); return true; }catch(e){ return false; } })();
const st = {
  keys(){ return canStore ? Object.keys(localStorage) : Array.from(memStore.keys()); },
  get(k){ return canStore ? localStorage.getItem(k) : (memStore.has(k)?memStore.get(k):null); },
  set(k,v){ if(canStore){ try{ localStorage.setItem(k,v); }catch(e){} } else { memStore.set(k,v); } },
  remove(k){ if(canStore){ localStorage.removeItem(k); } else { memStore.delete(k); } }
};
const REC_PREFIX = P+'record:';

// 日付は必ず現地時間で作る。toISOString() はUTCなので朝9時前だと前日になる。
function todayStr(d){
  const x = d ? new Date(d) : new Date();
  const p = n => String(n).padStart(2,'0');
  return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());
}
function jpDate(s){ if(!s) return ''; const a=s.split('-'); return a[0]+'年'+Number(a[1])+'月'+Number(a[2])+'日'; }

function readRecords(){
  const out = [];
  st.keys().filter(k=>k && k.startsWith(REC_PREFIX)).forEach(k=>{
    try{ const r = JSON.parse(st.get(k)); if(r) out.push(r); }catch(e){}
  });
  return out.sort((a,b)=> b.ts - a.ts);
}
function saveRecord(rec){ st.set(REC_PREFIX+rec.ts, JSON.stringify(rec)); }

function deviceId(){
  let d = st.get(DEVICE_KEY);
  if(!d){ d = 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); st.set(DEVICE_KEY,d); }
  return d;

function aikotoba(){ return st.get(AIKOTOBA_KEY) || ''; }

async function sbSignIn(pw){
  try{
    const r = await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email:SB_EMAIL, password:pw })
    });
    if(!r.ok) return false;
    const j = await r.json();
    sbToken = j.access_token || null;
    return !!sbToken;
  }catch(e){ return false; }
}
async function ensureAuth(){
  if(sbToken) return true;
  const pw = aikotoba();
  if(!pw) return false;
  return sbSignIn(pw);
}
async function sbFetch(path, opts, retry){
  if(!(await ensureAuth())) return null;
  let r;
  try{
    r = await fetch(SB_URL+path, Object.assign({}, opts, {
      headers: Object.assign({ apikey:SB_KEY, Authorization:'Bearer '+sbToken, 'Content-Type':'application/json' }, (opts&&opts.headers)||{})
    }));
  }catch(e){ return null; }
  if(r.status === 401 && retry !== false){ sbToken = null; return sbFetch(path, opts, false); }
  return r;
}

function recToRow(rec){

    ts: rec.ts, date: rec.date, form_no: rec.formNo,

    site: rec.site, client: rec.client,

  };

function rowToRec(row){
  return {
    ts: row.ts, date: row.date, formNo: row.form_no,
    machine: row.machine, model: row.model, mgmtNo: row.mgmt_no,
    site: row.site, client: row.client, shipDate: row.ship_date||'', returnDate: row.return_date||'',

  };
}

function pendingList(){ try{ const p = JSON.parse(st.get(PENDING_KEY)); return Array.isArray(p)?p:[]; }catch(e){ return []; } }
function setPending(l){ st.set(PENDING_KEY, JSON.stringify(l)); }

async function pushRecord(rec){
  const r = await sbFetch('/rest/v1/'+TABLE+'?on_conflict=device_id,ts', {
    method:'POST', headers:{ Prefer:'resolution=ignore-duplicates' },
    body: JSON.stringify([recToRow(rec)])
  });
  return !!(r && r.ok);
}
async function flushPending(){
  const list = pendingList();
  if(!list.length) return;
  const remain = [];
  for(const ts of list){
    let rec=null;
    try{ rec = JSON.parse(st.get(REC_PREFIX+ts)); }catch(e){}
    if(!rec) continue;
    if(!(await pushRecord(rec))) remain.push(ts);
  }
  setPending(remain);
  if(tab==='list') render();
}
async function loadRemote(){
  remote.ok = false; remote.loaded = true;
  // サインの絵を含めて取るので、あまり多く取らない（1件あたり30KBほど）。
  // 出荷は多くて週に数件なので、100件で2年分ほど見える。
  const r = await sbFetch('/rest/v1/'+TABLE+'?select=*&order=ts.desc&limit=100', {});
  if(!r || !r.ok) return;
  try{ remote.rows = (await r.json()).map(rowToRec); remote.ok = true; }catch(e){}
}

function commonFor(m){ const s = m.skip_common||[]; return MASTER.COMMON.filter(x=>s.indexOf(x[0])<0); }
function attachFor(m){ const s = m.skip_attach||[]; return MASTER.ATTACH.filter(x=>s.indexOf(x[0])<0); }
const MAXROWS = Math.max.apply(null, MACHINES.map(m => commonFor(m).length + m.items.length));

/* ---- 手書きサイン ----
   指かタッチペンでその場で書く。前のサインは使い回さない（毎回書く）。
   書いた線の範囲だけを切り出してPNGにし、記録と一緒に持たせる。 */
let signTarget = null;   // 'inspector' か 'shipper'
let signStrokes = [];    // 書いた線。切り出しの範囲を出すのに使う

function openSign(who, title){
  signTarget = who;
  signStrokes = [];
  document.getElementById('signTitle').textContent = title + 'のサイン';
  const ov = document.getElementById('signOverlay');
  ov.hidden = false;
  const cv = document.getElementById('signPad');
  // 画面の細かさに合わせる。これをやらないと線がぼやける
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#fff';
  g.fillRect(0, 0, r.width, r.height);
  // 太めにしておく。書き出すとき高さ200pxに縮めるので、細いと紙で薄くなる
  g.lineWidth = 4.6;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.strokeStyle = '#101010';
}
function closeSign(){
  document.getElementById('signOverlay').hidden = true;
  signTarget = null;
}
(function setupSignPad(){
  const cv = document.getElementById('signPad');
  let drawing = false, last = null, cur = null;
  const pos = e => {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  cv.addEventListener('pointerdown', e=>{
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    drawing = true;
    last = pos(e);
    cur = [last];
    signStrokes.push(cur);
  });
  cv.addEventListener('pointermove', e=>{
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    const g = cv.getContext('2d');
    g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke();
    last = p; cur.push(p);
  });
  const end = e=>{ if(drawing){ drawing = false; } };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', end);
})();
document.getElementById('signClear').onclick = ()=>{
  const who = signTarget, t = document.getElementById('signTitle').textContent.replace('のサイン','');
  openSign(who, t);
};
document.getElementById('signCancel').onclick = closeSign;
document.getElementById('signOk').onclick = ()=>{
  if(!signStrokes.length){ alert('まだ何も書かれていません。'); return; }
  const cv = document.getElementById('signPad');
  const dpr = cv.width / cv.getBoundingClientRect().width;
  // 書いた範囲だけを切り出す。余白ごと持つと、紙にしたとき字が小さくなる
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  signStrokes.forEach(s=>s.forEach(p=>{
    if(p.x<x0)x0=p.x; if(p.y<y0)y0=p.y; if(p.x>x1)x1=p.x; if(p.y>y1)y1=p.y;
  }));
  const pad = 8;
  x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad);
  x1=Math.min(cv.getBoundingClientRect().width, x1+pad);
  y1=Math.min(cv.getBoundingClientRect().height, y1+pad);
  const sw = Math.max(1, Math.round((x1-x0)*dpr)), sh = Math.max(1, Math.round((y1-y0)*dpr));
  // 紙では高さ8mmで刷る。200pxもあれば十分きれい。
  // そのまま持つと1枚40KB近くなり、記録が重くなる
  const MAXH = 200;
  const k = sh > MAXH ? MAXH / sh : 1;
  const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const og = out.getContext('2d');
  og.imageSmoothingQuality = 'high';
  og.fillStyle = '#fff'; og.fillRect(0,0,w,h);
  og.drawImage(cv, Math.round(x0*dpr), Math.round(y0*dpr), sw, sh, 0, 0, w, h);
  const url = out.toDataURL('image/png');
  form.signs = form.signs || {};
  form.signs[signTarget] = url;
  closeSign();
  render();
};

  return byName >= 0 ? byName : 0;
}

}

function newForm(idx){
  const m = MACHINES[idx];
  const items = [];
  let n = 1;
  commonFor(m).forEach(([nm,cr])=> items.push({sec:'共通', no:n++, name:nm, cr:cr, status:'', memo:''}));
  m.items.forEach(([nm,cr])=> items.push({sec:'機種別', no:n++, name:nm, cr:cr, status:'', memo:''}));
  attachFor(m).forEach(([nm,cr])=> items.push({sec:'付属品', no:n++, name:nm, cr:cr, status:'', memo:''}));
  return {
    formNo: 'SK-'+String(idx+1).padStart(2,'0'),
    machine: m.name, model: m.model, mgmtNo:'', site:'', client:'',
    shipDate:'', returnDate:'',
    items: items,
    meas: m.meas.map(([nm,std,unit])=>({name:nm, std:std, unit:unit, value:''})),
    remark:'', judge:'', judgeDate: todayStr(),
    inspector: st.get(P+'lastInspector')||'',
    foreman: st.get(P+'lastForeman')||'',
    shipper: MASTER.SHIPPER || '',  // 出荷責任者は工場長で固定
    signs: {}                       // 手書きサイン。毎回その場で書く
  };
}
// 点検者で「その他」を選んで手入力しているあいだだけ true

function counts(){
  const ng = form.items.filter(i=>i.status==='ng').length;
  const na = form.items.filter(i=>i.status==='na').length;
  const ok = form.items.filter(i=>i.status==='ok').length;
  const rest = form.items.length - ng - na - ok;
  return {ng, na, ok, rest};
}

function setTab(t){

}

async function doSave(){
  const c = counts();
  if(c.rest > 0 && !confirm('まだ判定していない項目が'+c.rest+'件あります。このまま記録しますか。')) return;
  if(!form.judge){ alert('総合判定を選んでください。'); return; }
  if(!form.inspector.trim()){ alert('点検者の名前を入れてください。'); return; }
  if(c.ng>0 && form.judge==='合格' && !confirm('「否」があるのに合格になっています。このまま記録しますか。')) return;
  const sg = form.signs || {};
  const noSign = [];
  if(!sg.inspector) noSign.push('点検者');
  if(!sg.shipper) noSign.push('出荷責任者');
  if(noSign.length && !confirm(noSign.join('と')+'のサインがありません。このまま記録しますか。')) return;

  st.set(P+'lastInspector', form.inspector);
  st.set(P+'lastForeman', form.foreman);

  const rec = {
    ts: Date.now(), date: todayStr(),
    formNo: form.formNo, machine: form.machine, model: form.model, mgmtNo: form.mgmtNo,
    site: form.site, client: form.client, shipDate: form.shipDate, returnDate: form.returnDate,
    items: form.items.map(i=>({no:i.no, sec:i.sec, name:i.name, status:i.status, memo:i.memo||''})),
    meas: form.meas.map(m=>({name:m.name, std:m.std, unit:m.unit, value:m.value})),
    remark: form.remark, judge: form.judge, judgeDate: form.judgeDate,
    inspector: form.inspector, foreman: form.foreman, shipper: form.shipper,
    signs: form.signs || {},
    ngCount: c.ng, naCount: c.na
  };
  saveRecord(rec);
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '送っています…';
  const ok = await pushRecord(rec);
  if(!ok){ const l = pendingList(); l.push(rec.ts); setPending(l); }
  remote.loaded = false;
  // 送れなかった理由を分けて伝える。「電波」と一括りにすると、
  // 合言葉が入っていないだけのときに原因を探せなくなる
  let msg;
  if(ok){
    msg = '記録しました。会社のデータベースへ送りました。';
  } else if(!aikotoba()){
    msg = '記録しました。ただし合言葉が入っていないので、この端末の中だけに残っています。\n\n'
        + '設定タブで合言葉を入れて「つないでみる」を押してください。そのあと「送り待ちをいま送る」で送れます。\n\n'
        + '（ホーム画面のアイコンとSafariでは、合言葉の保存場所が別になります。いつも同じほうから開いてください）';
  } else if(!navigator.onLine){
    msg = '記録しました。いま電波が届かないので端末に控えました。電波のあるところで自動的に送ります。';
  } else {
    msg = '記録しました。ただし送信に失敗したので端末に控えました。\n\n'
        + '設定タブを開いて、会社のデータベースにつながっているか確かめてください。';
  }
  alert(msg);
  inspectorOther = false;
  foremanOther = false;
  form = newForm(mi);
  setTab('list');
}

// 記録の一覧にもサインを小さく出す。入っているかどうかを、
// 点検票を開かなくても分かるようにするため。
function signStrip(r){
  const s = r.signs || {};
  if(!s.inspector && !s.shipper) return '<div class="muted">サインなし</div>';
  const cell = (img, label)=>
      '<div class="ssign">'
    +   (img ? '<img src="'+img+'" alt="">' : '<span class="none">なし</span>')
    +   '<span class="lb">'+label+'</span>'
    + '</div>';
  return '<div class="ssigns">' + cell(s.inspector,'点検者') + cell(s.shipper,'出荷責任者') + '</div>';
}

function renderList(){
  const local = readRecords();
  const pend = pendingList();
  const seen = {};
  const all = [];
  local.forEach(r=>{ seen[r.ts]=true; all.push(Object.assign({}, r, {waiting: pend.indexOf(r.ts)>=0})); });
  remote.rows.forEach(r=>{ if(!seen[r.ts]) all.push(r); });
  all.sort((a,b)=> b.ts - a.ts);

  let h = '';
  h += '<div class="state '+(remote.ok?'on':'off')+'">'
     + (remote.ok ? '会社のデータベースにつながっています（全'+remote.rows.length+'件）'
                  : (aikotoba() ? 'いまつながっていません。この端末の記録だけ表示しています。'
                                : '設定タブで合言葉を入れると、みんなの記録が見られます。'))
     + '</div>';
  if(pend.length){
    h += '<div class="alert">まだ送れていない記録が'+pend.length+'件あります。'
       + (aikotoba() ? '電波のあるところで自動的に送ります。'
                     : '<br>合言葉が入っていません。設定タブで入れると送れます。')
       + '</div>';
  }
  h += '<button class="sub" id="reload" style="width:100%;margin-bottom:12px">最新を読み込む</button>';

  if(!all.length){ h += '<div class="note">記録はまだありません。</div>'; }
  all.forEach(r=>{
    const bad = r.judge==='出荷不可' || r.ngCount>0;
    h += '<div class="rec">'
       + '<div class="h"><span>'+esc(r.formNo)+'　'+esc(r.machine)+'</span><span>'+esc(jpDate(r.date))+'</span></div>'
       + '<div class="b">'
       +   '<div>管理番号：'+esc(r.mgmtNo||'—')+'　／　出荷先：'+esc(r.site||'—')+'</div>'
       +   '<div class="jd'+(bad?' ng':'')+'">総合判定：'+esc(r.judge||'—')+'　否 '+(r.ngCount||0)+'件</div>'
       +   '<div class="muted">点検者：'+esc(r.inspector||'—')+'　確認：'+esc(r.foreman||'—')+'　出荷責任者：'+esc(r.shipper||'—')+'</div>'
       +   signStrip(r)
       +   (r.remark? '<div class="muted">特記：'+esc(r.remark)+'</div>':'')
       +   '<div style="margin-top:6px">'
       +     (r.waiting? '<span class="badge wait">送り待ち</span>' : '<span class="badge sent">送信済</span>')
       +     ' <button class="sub" data-paper="'+r.ts+'" style="padding:5px 9px;font-size:12.5px">点検票にする（PDF）</button>'
       +     ' <button class="sub" data-detail="'+r.ts+'" style="padding:5px 9px;font-size:12.5px">中身を見る</button>'
       +   '</div>'
       + '</div></div>';
  });
  main.innerHTML = h;
  document.getElementById('reload').onclick = ()=>{ remote.loaded=false; loadRemote().then(render); };
  main.querySelectorAll('[data-paper]').forEach(b=>{
    b.onclick = ()=>{
      const r = all.find(x=>String(x.ts)===b.dataset.paper);
      if(r) openPaper(r);
    };
  });
  main.querySelectorAll('[data-detail]').forEach(b=>{
    b.onclick = ()=>{
      const r = all.find(x=>String(x.ts)===b.dataset.detail);
      if(!r) return;
      const ng = (r.items||[]).filter(i=>i.status==='ng');
      const na = (r.items||[]).filter(i=>i.status==='na');
      let t = r.formNo+' '+r.machine+'（'+jpDate(r.date)+'）\n\n';
      t += '否：'+(ng.length? ng.map(i=>'・'+i.name+(i.memo?'／'+i.memo:'')).join('\n') : 'なし')+'\n\n';
      t += '該当なし：'+(na.length? na.map(i=>i.name).join('、') : 'なし')+'\n\n';
      t += '測定値：\n'+(r.meas||[]).map(m=>'・'+m.name+'　'+(m.value||'（未記入）')).join('\n');
      alert(t);
    };
  });
}

     + '</div></div>';
  h += '<div class="card"><h2>この様式について</h2><div class="body">'
     + '<div class="muted">'+MACHINES.map((m,k)=>'SK-'+String(k+1).padStart(2,'0')+'　'+esc(m.name)).join('<br>')+'</div>'
     + '<hr class="sep">'
     + '<div class="note">判定は「良」「否」「該当なし」の3つ。<b>「否」が1つでも残る機械は出荷しない。</b>'
     + '「要整備」で出す場合は出荷責任者の承認をもらうこと。現場搬入時は、この結果を「持込機械等使用届（安衛則第329条）」の点検表に転記する。</div>'
     + '</div></div>';
  main.innerHTML = h;
  document.getElementById('tryConn').onclick = async ()=>{
    const pw = document.getElementById('pw').value.trim();
    const msg = document.getElementById('connMsg');
    if(!pw){ msg.textContent = '合言葉を入れてください。'; return; }
    msg.textContent = 'つないでいます…';
    sbToken = null;
    const ok = await sbSignIn(pw);
    if(ok){ st.set(AIKOTOBA_KEY, pw); msg.textContent = 'つながりました。'; remote.loaded=false; flushPending(); }
    else { msg.textContent = 'つながりませんでした。合言葉と電波を確かめてください。'; }
  };
  document.getElementById('sendAll').onclick = async ()=>{ await flushPending(); renderSet(); };
}

window.addEventListener('online', ()=>{ flushPending(); });
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('./sw.js'); }catch(e){} }
flushPending();
render();
</script>
</body>
</html>
